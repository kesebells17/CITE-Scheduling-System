<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Summary | CiteApp Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/theme.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .reports-container {
            padding: 24px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: white;
            padding: 24px;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 800;
            color: var(--text-main);
        }

        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
            margin-bottom: 32px;
        }

        .chart-card {
            background: white;
            padding: 24px;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
        }

        .chart-card h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 24px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chart-container {
            height: 300px;
            position: relative;
        }

        .filters-bar {
            background: white;
            padding: 16px 24px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            margin-bottom: 24px;
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-group label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .filter-group input,
        .filter-group select {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 13px;
            outline: none;
        }

        .export-btn {
            margin-left: auto;
            display: flex;
            gap: 8px;
        }

        @media (max-width: 1024px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body class="dashboard-page">
    <!-- Sidebar (same as admin_records.html but with active link) -->
    <aside class="sidebar" id="sidebar">
        <div class="logo-container">
            <img src="../images/citeneww.png" alt="CITE Logo" class="sidebar-logo">
            <span class="logoAdmin">Admin</span>
        </div>
        <nav class="nav-links">
            <a href="admin_dashboard.html" class="nav-item"><i class="fas fa-home"></i><span>Dashboard</span></a>
            <a href="admin_manage_instructors.html" class="nav-item"><i
                    class="fas fa-chalkboard-teacher"></i><span>Manage Instructors</span></a>
            <a href="admin_manage_students.html" class="nav-item"><i class="fas fa-user-graduate"></i><span>Manage
                    Students</span></a>
            <a href="admin_announcements.html" class="nav-item"><i
                    class="fas fa-bullhorn"></i><span>Announcements</span></a>
            <a href="admin_dashboard.html" class="nav-item"><i class="fas fa-user-plus"></i><span>Walk-in
                    Booking</span></a>
            <a href="admin_records.html" class="nav-item"><i class="fas fa-database"></i><span>Records</span></a>
            <a href="admin_reports.html" class="nav-item active"><i class="fas fa-chart-line"></i><span>Report
                    Summary</span></a>
        </nav>
    </aside>

    <div class="main-content" id="mainContent">
        <header class="top-header">
            <div style="display:flex; align-items:center; gap:16px;">
                <button class="menu-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
                <div class="page-title">Report Summary</div>
            </div>
            <div class="header-actions">
                <span id="currentTime"
                    style="color:var(--text-muted); font-size:13px; font-weight:500; margin-right:8px;"></span>
                <div class="header-divider"></div>
                <button class="header-btn" onclick="logout()" title="Logout"><i
                        class="fas fa-sign-out-alt"></i></button>
            </div>
        </header>

        <div class="reports-container">
            <!-- Filters -->
            <div class="filters-bar">
                <div class="filter-group">
                    <label>From</label>
                    <input type="date" id="reportDateFrom">
                </div>
                <div class="filter-group">
                    <label>To</label>
                    <input type="date" id="reportDateTo">
                </div>
                <button class="btn btn-primary" onclick="loadReportData()" style="padding: 8px 16px;"><i
                        class="fas fa-sync" style="margin-right:8px;"></i>Update Report</button>
                <div class="export-btn">
                    <button class="btn btn-outline" onclick="exportData('csv')"><i class="fas fa-file-csv"
                            style="margin-right:8px;"></i>CSV</button>
                    <button class="btn btn-outline" onclick="window.print()"><i class="fas fa-file-pdf"
                            style="margin-right:8px;"></i>PDF</button>
                </div>
            </div>

            <!-- Stats Recap -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-header">
                        <span>TOTAL BOOKINGS</span>
                        <div class="stat-icon"
                            style="background: rgba(var(--primary-rgb), 0.1); color: var(--primary);"><i
                                class="fas fa-calendar-check"></i></div>
                    </div>
                    <div class="stat-value" id="valTotal">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-header">
                        <span>COMPLETED</span>
                        <div class="stat-icon" style="background: #ecfdf5; color: #10b981;"><i
                                class="fas fa-check-circle"></i></div>
                    </div>
                    <div class="stat-value" id="valCompleted">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-header">
                        <span>CANCELLED</span>
                        <div class="stat-icon" style="background: #fef2f2; color: #ef4444;"><i
                                class="fas fa-times-circle"></i></div>
                    </div>
                    <div class="stat-value" id="valCancelled">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-header">
                        <span>ARCHIVED</span>
                        <div class="stat-icon" style="background: #f8fafc; color: #64748b;"><i
                                class="fas fa-archive"></i></div>
                    </div>
                    <div class="stat-value" id="valArchived">0</div>
                </div>
            </div>

            <!-- Charts Grid -->
            <div class="charts-grid">
                <!-- Status Chart -->
                <div class="chart-card">
                    <h3><i class="fas fa-chart-pie"></i> Booking Status Distribution</h3>
                    <div class="chart-container">
                        <canvas id="statusChart"></canvas>
                    </div>
                </div>
                <!-- Growth Chart -->
                <div class="chart-card">
                    <h3><i class="fas fa-chart-bar"></i> Monthly Booking Growth</h3>
                    <div class="chart-container">
                        <canvas id="growthChart"></canvas>
                    </div>
                </div>
                <!-- Peak Times (Day) -->
                <div class="chart-card">
                    <h3><i class="fas fa-clock"></i> Peak Booking Days</h3>
                    <div class="chart-container">
                        <canvas id="daysChart"></canvas>
                    </div>
                </div>
                <!-- Top Instructors -->
                <div class="chart-card">
                    <h3><i class="fas fa-award"></i> Most Active Instructors</h3>
                    <div class="chart-container">
                        <canvas id="instructorsChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Color Palette
        const colors = {
            primary: '#065F46',
            success: '#10B981',
            danger: '#EF4444',
            warning: '#F59E0B',
            muted: '#64748B',
            chart: ['#065F46', '#10B981', '#34D399', '#6EE7B7', '#A7F3D0']
        };

        let charts = {};

        document.addEventListener('DOMContentLoaded', () => {
            // Set default dates (last 30 days)
            const today = new Date();
            const last30 = new Date(today);
            last30.setDate(today.getDate() - 30);
            document.getElementById('reportDateTo').value = today.toISOString().split('T')[0];
            document.getElementById('reportDateFrom').value = last30.toISOString().split('T')[0];

            loadReportData();
            updateClock();
            setInterval(updateClock, 1000);

            // Toggle Sidebar
            const toggle = document.getElementById('sidebarToggle');
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('mainContent');
            if (toggle && sidebar) {
                toggle.onclick = () => {
                    sidebar.classList.toggle('collapsed');
                    mainContent.classList.toggle('expanded');
                }
            }
        });

        function updateClock() {
            const now = new Date();
            document.getElementById('currentTime').textContent = now.toLocaleDateString() + ' | ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        async function loadReportData() {
            const from = document.getElementById('reportDateFrom').value;
            const to = document.getElementById('reportDateTo').value;
            try {
                const res = await fetch(`../php/get_report_summary.php?date_from=${from}&date_to=${to}`);
                const j = await res.json();
                if (j.success) {
                    renderStats(j.data);
                    renderCharts(j.data);
                } else {
                    alert(j.message);
                }
            } catch (e) { console.error(e); }
        }

        function renderStats(data) {
            const statusMap = {};
            data.status_distribution.forEach(s => statusMap[s.status] = parseInt(s.count));

            const total = data.status_distribution.reduce((acc, curr) => acc + parseInt(curr.count), 0);
            document.getElementById('valTotal').textContent = total;
            document.getElementById('valCompleted').textContent = statusMap['Completed'] || 0;
            document.getElementById('valCancelled').textContent = (statusMap['Cancelled'] || 0) + (statusMap['Declined'] || 0);

            let archived = 0;
            data.archive_stats.forEach(s => { if (s.is_archived == 1) archived = s.count; });
            document.getElementById('valArchived').textContent = archived;
        }

        function renderCharts(data) {
            // 1. Status Chart (Pie)
            updateOrCreateChart('statusChart', 'pie', {
                labels: data.status_distribution.map(s => s.status),
                datasets: [{
                    data: data.status_distribution.map(s => s.count),
                    backgroundColor: [colors.primary, colors.success, colors.danger, colors.warning, colors.muted],
                    borderWidth: 0
                }]
            }, {
                plugins: { legend: { position: 'bottom' } },
                maintainAspectRatio: false
            });

            // 2. Growth Chart (Bar)
            updateOrCreateChart('growthChart', 'bar', {
                labels: (data.bookings_over_time || []).reverse().map(b => b.month),
                datasets: [{
                    label: 'Bookings',
                    data: (data.bookings_over_time || []).map(b => b.count),
                    backgroundColor: colors.primary,
                    borderRadius: 6
                }]
            });

            // 3. Days Chart (Radar or PolarArea for peak days)
            updateOrCreateChart('daysChart', 'polarArea', {
                labels: data.peak_days.map(d => d.day),
                datasets: [{
                    data: data.peak_days.map(d => d.count),
                    backgroundColor: colors.chart,
                    borderWidth: 1
                }]
            }, {
                maintainAspectRatio: false,
                plugins: { legend: { position: 'right' } }
            });

            // 4. Instructors Chart (Horizontal Bar)
            updateOrCreateChart('instructorsChart', 'bar', {
                labels: data.top_instructors.map(i => i.name),
                datasets: [{
                    label: 'Appointments',
                    data: data.top_instructors.map(i => i.count),
                    backgroundColor: colors.success,
                    borderRadius: 6
                }]
            }, {
                indexAxis: 'y',
                maintainAspectRatio: false
            });
        }

        function updateOrCreateChart(id, type, data, options = {}) {
            if (charts[id]) charts[id].destroy();
            const ctx = document.getElementById(id).getContext('2d');
            charts[id] = new Chart(ctx, {
                type: type,
                data: data,
                options: {
                    responsive: true,
                    ...options
                }
            });
        }

        function exportData(type) {
            if (type === 'csv') {
                // simple CSV generator for total bookings
                alert('Downloading CSV data...');
                window.open('../php/export_current_records.php?type=all_appointments');
            }
        }

        function logout() {
            fetch('../php/logout.php').then(() => window.location.href = 'login.html');
        }
    </script>
</body>

</html>
